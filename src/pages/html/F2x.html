<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Animation SVG</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
        }

        svg {
            width: 500px;
            height: 500px;
        }

        .shape {
            animation: moveShape 4s ease-in-out infinite alternate;
        }

        @keyframes moveShape {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }

            100% {
                transform: translate(50px, 50px) rotate(20deg);
            }
        }
    </style>
</head>

<body>
    <svg viewBox="0 0 500 500">
        <!-- Cercle -->
        <circle class="shape" cx="100" cy="100" r="40" fill="#ff6b6b" />
        <!-- Rectangle -->
        <rect class="shape" x="300" y="50" width="80" height="80" fill="#4ecdc4" />
        <!-- Triangle -->
        <polygon class="shape" points="100,300 150,400 50,400" fill="#ffe66d" />
        <!-- Carré -->
        <rect class="shape" x="350" y="300" width="70" height="70" fill="#1a535c" />
        <!-- Ellipse -->
        <ellipse class="shape" cx="250" cy="250" rx="60" ry="30" fill="#ff9f1c" />
    </svg>
</body>

</html>
