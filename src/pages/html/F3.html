<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Geometric Kinetic | Moving Portraits Effect</title>
    <style>
        body {
            margin: 0;
            background: #0b1522;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 150px);
            gap: 40px;
        }

        .card {
            width: 150px;
            height: 150px;
            position: relative;
            cursor: pointer;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>

<body>

    <div class="grid">
        <!-- 5 formes SVG -->
        <div class="card"><svg viewBox="0 0 100 100">
                <rect x="25" y="25" width="50" height="50" fill="#e63946" />
            </svg></div>
        <div class="card"><svg viewBox="0 0 100 100">
                <polygon points="50,20 80,80 20,80" fill="#ffb703" />
            </svg></div>
        <div class="card"><svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="25" fill="#4cc9f0" />
            </svg></div>
        <div class="card"><svg viewBox="0 0 100 100">
                <rect x="30" y="30" width="40" height="40" fill="#fff" transform="rotate(45 50 50)" />
            </svg></div>
        <div class="card"><svg viewBox="0 0 100 100">
                <polygon points="50,10 90,50 50,90 10,50" fill="#a0710b" />
            </svg></div>
    </div>

    <script>
        // Variables de suivi de souris
        let mouse = { x: 0, y: 0 };
        const lerp = (a, b, n) => (1 - n) * a + n * b; // Fonction de lissage (interpolation)

        // Initialisation des objets
        const cards = document.querySelectorAll('.card');
        const shapes = Array.from(cards).map(card => {
            return {
                el: card.querySelector('svg'),
                x: 0, y: 0, // Position actuelle
                tx: 0, ty: 0 // Position cible
            };
        });

        window.addEventListener('mousemove', (e) => {
            // Normalisation entre -1 et 1
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = (e.clientY / window.innerHeight) * 2 - 1;
        });

        function animate() {
            shapes.forEach((s, index) => {
                // Création de l'effet de profondeur : les formes bougent à des vitesses différentes
                const speed = 0.05 + (index * 0.02);
                s.tx = mouse.x * 50;
                s.ty = mouse.y * 50;

                // Interpolation linéaire pour l'effet de fluidité (le secret de Bernadou)
                s.x = lerp(s.x, s.tx, speed);
                s.y = lerp(s.y, s.ty, speed);

                s.el.style.transform = `translate(${s.x}px, ${s.y}px) scale(${1 + Math.abs(s.x * 0.001)})`;
            });
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>

</html>
