<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phénix en vol - SVG</title>
    <style>
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        svg {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

<body>

    <svg viewBox="0 0 800 600" width="800" height="600" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Dégradé pour les ailes et le corps (effet feu) -->
            <linearGradient id="fireGradient" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#ff4500" />
                <stop offset="50%" stop-color="#ff8c00" />
                <stop offset="100%" stop-color="#ffd700" />
            </linearGradient>

            <!-- Dégradé pour la queue ardente -->
            <linearGradient id="tailGradient" x1="50%" y1="0%" x2="50%" y2="100%">
                <stop offset="0%" stop-color="#ff6347" />
                <stop offset="50%" stop-color="#ff4500" />
                <stop offset="100%" stop-color="#8b0000" />
            </linearGradient>

            <!-- Filtre de lueur (glow) -->
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="8" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
        </defs>

        <!-- Fond sombre pour faire ressortir les flammes -->
        <rect width="800" height="600" fill="#111215" />

        <g filter="url(#glow)">
            <!-- Queue du Phénix (plumes de feu descendantes) -->
            <path
                d="M 400 320 C 380 420 340 500 300 560 C 360 480 390 420 400 360 C 410 420 440 480 500 560 C 460 500 420 420 400 320 Z"
                fill="url(#tailGradient)" />
            <path
                d="M 400 340 C 390 440 370 520 350 580 C 390 500 400 440 400 380 C 400 440 410 500 450 580 C 430 520 410 440 400 340 Z"
                fill="#ffd700" opacity="0.8" />

            <!-- Corps et Tête -->
            <path d="M 400 180 C 375 220 370 280 385 340 C 395 370 405 370 415 340 C 430 280 425 220 400 180 Z"
                fill="url(#fireGradient)" />
            <!-- Tête -->
            <circle cx="400" cy="165" r="18" fill="url(#fireGradient)" />
            <!-- Bec -->
            <path d="M 400 150 L 408 160 L 400 165 Z" fill="#ff4500" />

            <!-- Aile Gauche (déployée vers le haut) -->
            <path d="M 390 220 C 300 180 180 100 80 60 C 140 160 220 240 330 310 C 350 320 370 300 390 220 Z"
                fill="url(#fireGradient)" />
            <!-- Plumes secondaires aile gauche -->
            <path d="M 350 260 C 270 210 180 140 110 100 C 160 180 240 250 310 305 Z" fill="#ffd700" opacity="0.7" />

            <!-- Aile Droite (déployée vers le haut) -->
            <path d="M 410 220 C 500 180 620 100 720 60 C 660 160 580 240 470 310 C 450 320 430 300 410 220 Z"
                fill="url(#fireGradient)" />
            <!-- Plumes secondaires aile droite -->
            <path d="M 450 260 C 530 210 620 140 690 100 C 640 180 560 250 490 305 Z" fill="#ffd700" opacity="0.7" />
        </g>
    </svg>

</body>

</html>
