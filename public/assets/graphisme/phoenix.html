<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Phénix Égyptien SVG</title>
    <style>
        body {
            background-color: #121214;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Cinzel', 'Georgia', serif;
        }

        .logo-container {
            text-align: center;
        }

        svg {
            width: 300px;
            height: 300px;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.3));
        }

        h1 {
            color: #d4af37;
            letter-spacing: 8px;
            margin-top: 25px;
            font-size: 24px;
        }

        p {
            color: #48cae4;
            letter-spacing: 6px;
            font-size: 10px;
            margin-top: -12px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <div class="logo-container">
        <!-- Logo SVG Phénix / Bénou Style Égyptien -->
        <svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="egyptianGold" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#f39c12" />
                    <stop offset="50%" stop-color="#f1c40f" />
                    <stop offset="100%" stop-color="#b7950b" />
                </linearGradient>
                <linearGradient id="nileBlue" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#00b4d8" />
                    <stop offset="100%" stop-color="#03045e" />
                </linearGradient>
            </defs>

            <!-- Disque Solaire de Râ en arrière-plan -->
            <circle cx="250" cy="180" r="70" fill="url(#egyptianGold)" opacity="0.2" />
            <circle cx="250" cy="180" r="50" fill="none" stroke="url(#egyptianGold)" stroke-width="3"
                stroke-dasharray="10 5" />

            <!-- Ailes géométriques stylisées (inspirées des fresques) -->
            <polygon points="250,160 120,100 80,180 160,240 250,220" fill="url(#egyptianGold)" />
            <polygon points="250,160 380,100 420,180 340,240 250,220" fill="url(#egyptianGold)" />

            <!-- Corps et Coiffe du Phénix (Bénou) -->
            <path fill="url(#egyptianGold)" d="M230,120 L250,60 L270,120 L280,260 L250,340 L220,260 Z" />

            <!-- Plumes de la coiffe (type huppe) -->
            <path fill="#00b4d8" d="M250,60 L240,20 L250,10 L260,20 Z" />

            <!-- Queue géométrique suspendue -->
            <polygon points="235,340 250,440 265,340" fill="url(#nileBlue)" />

            <!-- Détails de l'or (Lignes symboliques) -->
            <line x1="250" y1="220" x2="250" y2="340" stroke="#121214" stroke-width="4" />
            <line x1="160" y1="150" x2="210" y2="180" stroke="#121214" stroke-width="3" />
            <line x1="340" y1="150" x2="290" y2="180" stroke="#121214" stroke-width="3" />
        </svg>

        <h1>BENOU</h1>
        <p>L'Immortel Solaire</p>
    </div>

</body>

</html>
