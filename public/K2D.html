<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symphonie Animée - Hommage au Tableau Bleu de Kandinsky</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1b2a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        .canvas-container {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border: 12px solid #111;
            background: #000;
        }

        /* ========================================== */
        /* CONFIGURATION DES ANIMATIONS PAR DÉFAUT     */
        /* ========================================== */

        /* 1. Le Triangle Jaune (Lévitation par défaut + Rotation au Clic) */
        .animated-triangle {
            transform-origin: 380px 450px;
            opacity: 0.75;
            cursor: pointer;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease-out;
            animation: triangleFloat 6s ease-in-out infinite;
        }

        .animated-triangle:active {
            transform: rotate(360deg) scale(1.05);
            opacity: 1;
            animation: none;
        }

        /* 2. Le Grand Anneau Bleu (Rotation lente continue) */
        .animated-ring {
            transform-origin: 500px 380px;
            animation: slowRotateCW 25s linear infinite;
        }

        /* 3. Le Disque Bleu Translucide (Contre-rotation et pulsation) */
        .animated-disk {
            transform-origin: 480px 400px;
            animation: slowRotateCCW 20s linear infinite, pulseOpacity 8s ease-in-out infinite;
        }

        /* 4. Les Grandes Diagonales Noires (Légère oscillation/vibration) */
        .animated-line-1 {
            transform-origin: 450px 375px;
            animation: lineVibrate1 7s ease-in-out infinite;
        }

        .animated-line-2 {
            transform-origin: 505px 375px;
            animation: lineVibrate2 9s ease-in-out infinite;
        }

        /* 5. La Grille / Damier (Effet de balancier/pendule) */
        .animated-grid {
            transform-origin: 650px 220px;
            animation: gridSwing 12s ease-in-out infinite;
        }

        /* 6. Le Groupe Cible et ses Satellites (Flottaison et pulsation) */
        .animated-cosmos {
            transform-origin: 350px 250px;
            animation: cosmosFloat 8s ease-in-out infinite;
        }

        /* 7. Les Faisceaux de lignes blanches / Cordes (Vibration harmonique) */
        .animated-strings {
            transform-origin: 815px 522px;
            animation: stringVibrate 5s ease-in-out infinite;
        }

        /* ========================================== */
        /* KEYFRAMES CSS (LES MOUVEMENTS)             */
        /* ========================================== */
        @keyframes triangleFloat {

            0%,
            100% {
                transform: translateY(0px) scale(1);
                opacity: 0.75;
            }

            50% {
                transform: translateY(-20px) scale(1.01);
                opacity: 0.95;
            }
        }

        @keyframes slowRotateCW {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes slowRotateCCW {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(-360deg);
            }
        }

        @keyframes pulseOpacity {

            0%,
            100% {
                opacity: 0.15;
            }

            50% {
                opacity: 0.35;
            }
        }

        @keyframes lineVibrate1 {

            0%,
            100% {
                transform: rotate(0deg);
            }

            50% {
                transform: rotate(1.5deg);
            }
        }

        @keyframes lineVibrate2 {

            0%,
            100% {
                transform: rotate(0deg);
            }

            50% {
                transform: rotate(-1.2deg);
            }
        }

        @keyframes gridSwing {

            0%,
            100% {
                transform: translate(650px, 220px) rotate(15deg);
            }

            50% {
                transform: translate(650px, 220px) rotate(22deg);
            }
        }

        @keyframes cosmosFloat {

            0%,
            100% {
                transform: translate(0px, 0px);
            }

            50% {
                transform: translate(-10px, 15px);
            }
        }

        @keyframes stringVibrate {

            0%,
            100% {
                transform: scaleY(1);
                opacity: 0.4;
            }

            50% {
                transform: scaleY(1.05) skewX(1deg);
                opacity: 0.6;
            }
        }
    </style>
</head>

<body>

    <div class="canvas-container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="90vw" height="67.5vw"
            style="max-width: 1000px; max-height: 750px;">

            <defs>
                <radialGradient id="bg-grad-1" cx="40%" cy="40%" r="60%">
                    <stop offset="0%" stop-color="#1e3d59" />
                    <stop offset="50%" stop-color="#17b978" stop-opacity="0.2" />
                    <stop offset="100%" stop-color="#07111e" />
                </radialGradient>

                <linearGradient id="yellow-sun" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ffb703" />
                    <stop offset="100%" stop-color="#fdffb6" />
                </linearGradient>

                <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="15" />
                </filter>
            </defs>

            <rect width="1000" height="750" fill="url(#bg-grad-1)" />
            <circle cx="300" cy="250" r="180" fill="#000814" opacity="0.6" filter="url(#soft-blur)" />
            <circle cx="750" cy="500" r="220" fill="#051c33" opacity="0.8" filter="url(#soft-blur)" />
            <path d="M100,600 Q300,400 600,650 T1000,550 L1000,750 L0,750 Z" fill="#0a2540" opacity="0.4"
                filter="url(#soft-blur)" />
            <circle cx="200" cy="200" r="90" fill="#e63946" opacity="0.15" filter="url(#soft-blur)" />
            <circle cx="800" cy="250" r="120" fill="#ffb703" opacity="0.12" filter="url(#soft-blur)" />

            <polygon class="animated-triangle" points="150,650 450,150 550,550" fill="url(#yellow-sun)" />

            <path d="M 600,200 C 750,220 850,400 700,550 C 650,450 620,300 600,200 Z" fill="#080f1a" stroke="#4cc9f0"
                stroke-width="1.5" opacity="0.9" />

            <circle class="animated-ring" cx="500" cy="380" r="170" fill="none" stroke="#4361ee" stroke-width="4"
                opacity="0.4" />

            <circle class="animated-disk" cx="480" cy="400" r="140" fill="#4cc9f0" opacity="0.15" />

            <line class="animated-line-1" x1="50" y1="100" x2="850" y2="650" stroke="#000" stroke-width="3" />

            <line class="animated-line-2" x1="90" y1="550" x2="920" y2="200" stroke="#000" stroke-width="2" />

            <line x1="500" y1="50" x2="300" y2="700" stroke="#000" stroke-width="1.5" />

            <path d="M 150,300 Q 400,100 850,350" fill="none" stroke="#fff" stroke-width="2" opacity="0.7" />
            <path d="M 200,680 Q 600,500 750,100" fill="none" stroke="#ff007f" stroke-width="1.5" opacity="0.6" />

            <g class="animated-strings" stroke="#fff" stroke-width="1">
                <line x1="700" y1="550" x2="900" y2="450" />
                <line x1="710" y1="565" x2="910" y2="465" />
                <line x1="720" y1="580" x2="920" y2="480" />
                <line x1="730" y1="595" x2="930" y2="495" />
            </g>

            <g class="animated-grid">
                <rect x="0" y="0" width="80" height="80" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.7" />
                <line x1="20" y1="0" x2="20" y2="80" stroke="#fff" stroke-width="1" opacity="0.7" />
                <line x1="40" y1="0" x2="40" y2="80" stroke="#fff" stroke-width="1" opacity="0.7" />
                <line x1="60" y1="0" x2="60" y2="80" stroke="#fff" stroke-width="1" opacity="0.7" />
                <line x1="0" y1="20" x2="80" y2="20" stroke="#fff" stroke-width="1" opacity="0.7" />
                <line x1="0" y1="40" x2="80" y2="40" stroke="#fff" stroke-width="1" opacity="0.7" />
                <line x1="0" y1="60" x2="80" y2="60" stroke="#fff" stroke-width="1" opacity="0.7" />
                <rect x="20" y="20" width="20" height="20" fill="#e63946" />
                <rect x="40" y="60" width="20" height="20" fill="#ffb703" />
                <rect x="0" y="40" width="20" height="20" fill="#4cc9f0" />
            </g>

            <g class="animated-cosmos">
                <circle cx="350" cy="250" r="40" fill="#f1faee" opacity="0.9" />
                <circle cx="350" cy="250" r="30" fill="#e63946" />
                <circle cx="350" cy="250" r="15" fill="#000" />
                <circle cx="350" cy="250" r="5" fill="#fff" />

                <circle cx="280" cy="200" r="12" fill="#000" />
                <circle cx="250" cy="230" r="8" fill="#4cc9f0" />
                <circle cx="290" cy="160" r="15" fill="none" stroke="#fff" stroke-width="2" />
                <circle cx="310" cy="140" r="6" fill="#ffb703" />
            </g>

            <polygon points="780,120 800,160 760,150" fill="#e63946" opacity="0.8" />
            <polygon points="200,450 220,440 210,470" fill="#fff" opacity="0.9" />

            <g stroke="#000" stroke-width="2">
                <line x1="450" y1="480" x2="480" y2="510" />
                <line x1="460" y1="470" x2="490" y2="500" />
                <line x1="470" y1="460" x2="500" y2="490" />
            </g>

            <path d="M 720,420 Q 750,380 780,410 T 840,430 T 800,480 Z" fill="#fff" opacity="0.15" />
            <path d="M 730,430 Q 750,400 770,420" fill="none" stroke="#000" stroke-width="1.5" />

            <circle cx="480" cy="220" r="4" fill="#fff" />
            <circle cx="510" cy="205" r="3" fill="#fff" />
            <circle cx="495" cy="240" r="5" fill="#e63946" />
            <circle cx="150" cy="520" r="3" fill="#ffb703" />
            <circle cx="170" cy="545" r="4" fill="#000" />

        </svg>
    </div>

</body>

</html>
